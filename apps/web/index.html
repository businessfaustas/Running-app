    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <meta property="og:title" content="PaceMates" />

    <title>PaceMates – bėk ir mink kartu</title>

  <body style="background: #05070d">
    <div id="root">
      <!-- Splash until the app has loaded; React replaces it. -->
      <div
        style="position: fixed; inset: 0; display: grid; place-items: center; background: #05070d"
        aria-label="Kraunama"
      >
        <svg
          width="64"
          height="64"
          viewBox="0 0 100 100"
          aria-hidden="true"
          style="animation: pm-pulse 1.2s ease-in-out infinite"
        >
          <g
            fill="none"
            stroke="#ffffff"
            stroke-width="10.68"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M5.34 88.55V54.23A24.49 24.49 0 0 1 29.83 29.74C45.12 29.74 43.14 42.01 66.12 42.01A10.94 10.94 0 0 0 73.15 39.45L94.66 21.39"
            />
            <path
              d="M5.34 54.23A24.49 24.49 0 0 0 29.83 78.72C45.12 78.72 43.14 66.46 66.12 66.46A10.94 10.94 0 0 1 73.15 69.02L94.66 87.07"
            />
          </g>
          <circle cx="61.79" cy="16.43" r="10.32" fill="#d4ff3f" />
        </svg>
      </div>
      <style>
        @keyframes pm-pulse {
          50% {
            opacity: 0.4;
            transform: scale(0.94);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          svg {
            animation: none !important;
          }
        }
      </style>
    </div>
    <noscript>
      <p style="color: #fff; font-family: sans-serif; text-align: center; padding: 2rem">
        PaceMates veikia tik įjungus JavaScript.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
