# Weekly dependency updates, grouped so there is one pull request, not twenty. Security fixes
# arrive immediately regardless of this schedule once Dependabot security updates are on.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
