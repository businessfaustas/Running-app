# Nightly, encrypted backup of the Supabase database, kept as a workflow artifact for 30 days.
#
# Setup (once): in GitHub → Settings → Secrets and variables → Actions, add
#   SUPABASE_DB_URL     Supabase → Connect → "Session pooler" connection string (with password)
#   BACKUP_PASSPHRASE   a long random passphrase; keep a copy somewhere safe (password manager)
# Restore steps: see "Backups" in README.md.
name: Database backup

on:
  schedule:
    - cron: '17 2 * * *' # every night, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Backups are off: add the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Install the PostgreSQL 17 client
        if: env.SKIP != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump, check and encrypt
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          PG=/usr/lib/postgresql/17/bin
          name="pacemates-$(date -u +%Y-%m-%dT%H%MZ).dump"
          mkdir -p backup
          # App data plus logins. Short-lived auth rows (sessions, tokens, audit log) are
          # skipped: after a restore everyone simply signs in again.
          "$PG/pg_dump" "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth \
            --exclude-table-data='auth.sessions' \
            --exclude-table-data='auth.refresh_tokens' \
            --exclude-table-data='auth.audit_log_entries' \
            --exclude-table-data='auth.flow_state' \
            --exclude-table-data='auth.one_time_tokens' \
            --exclude-table-data='auth.mfa_challenges' \
            --file="backup/$name"
          # A backup that can't be read is no backup: list its contents before keeping it.
          "$PG/pg_restore" --list "backup/$name" > /dev/null
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" --output "backup/$name.gpg" "backup/$name"
          rm "backup/$name"
          ls -lh backup

      - name: Keep for 30 days
        if: env.SKIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/*.gpg
          retention-days: 30
          if-no-files-found: error
